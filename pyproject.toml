[project]
name = "sax-bridge"
description = "ComfyUI custom nodes for Pipe-based workflow management, KSampler, Detailer, Upscaler, SAM3 segmentation, Toggle Manager, and Collector nodes."
version = "2.3.0"
license = { file = "LICENSE" }
requires = []
dependencies = []

[project.urls]
Repository = "https://github.com/so16tm/SAX_Bridge"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.comfy]
PublisherId = "so16tm"
DisplayName = "SAX Bridge"
Icon = "https://raw.githubusercontent.com/so16tm/SAX_Bridge/main/docs/images/icon.png"

# ruff のバージョンで既定ルールが変わる (0.16 以降は既定が広い) ため、従来の既定 (0.15.8) に固定する。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
